<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLOPX: Compute Economy Terminal</title>
    <meta name="description" content="FLOPX: a terminal for the global AI compute economy. Observe, infer, forecast and decide." />
    <link rel="icon" href="/favicon.png" />
    <script>
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('flopx.theme')
        if (t === 'light') document.documentElement.dataset.blend = 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
