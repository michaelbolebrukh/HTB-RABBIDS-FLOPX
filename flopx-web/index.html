<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FLOPX: Compute Economy Terminal</title>
    <meta name="description" content="FLOPX: a terminal for the global AI compute economy. Observe, infer, forecast and decide." />
    <link rel="icon" href="/favicon.png" />
    <!-- Installable to the home screen as a standalone app. No service worker on purpose: no stale caches during the demo. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e10" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f1e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLOPX" />
    <script>
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('flopx.theme')
        if (t === 'light') document.documentElement.dataset.blend = 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
